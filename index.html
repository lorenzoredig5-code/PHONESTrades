<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeSystem - Marketplace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-exchange-alt text-cyan-500 text-xl"></i>
      <h1 class="text-lg font-bold tracking-wider text-cyan-400">TradeSystem</h1>
    </div>
    <div id="user-info" class="flex items-center gap-4 text-sm">
      <span id="display-username" class="text-slate-400"></span>
      <button onclick="logout()" class="bg-rose-950 text-rose-400 border border-rose-800 px-3 py-1 rounded-lg hover:bg-rose-900 transition-all text-xs font-semibold">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col gap-6">

    <!-- LOGIN / REGISTER SCREEN -->
    <section id="auth-section" class="max-w-md w-full mx-auto my-auto bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-cyan-400">Bem-vindo</h2>
        <p class="text-xs text-slate-400 mt-1">Entre ou cadastre-se para negociar</p>
      </div>
      <div class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 mb-1 block">Nome de Usuário</label>
          <input type="text" id="auth-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-200" placeholder="Digite seu usuário...">
        </div>
        <div class="flex gap-2 mt-2">
          <button onclick="handleAuth('login')" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg">Entrar</button>
          <button onclick="handleAuth('register')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-sm transition-all border border-slate-700">Cadastrar</button>
        </div>
      </div>
    </section>

    <!-- DASHBOARD / GAME SCREEN -->
    <section id="dashboard-section" class="hidden flex flex-col gap-6">
      
      <!-- SEÇÃO DE BUSCA E PEDIDOS DE TROCA -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
        <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass text-cyan-400"></i> Buscar Jogador para Troca
        </h3>
        <div class="flex gap-2">
          <input type="text" id="trade-search-input" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500" placeholder="Nome do usuário parceiro...">
          <button onclick="searchAndRequestTrade()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-5 py-2 rounded-xl text-sm transition-all shadow-md">Convidar</button>
        </div>
        <div id="incoming-requests-container" class="hidden flex flex-col gap-2 mt-2">
          <!-- Convites pendentes de troca aparecem aqui -->
        </div>
      </div>

      <!-- SALA DE TROCA ATIVA -->
      <div id="active-trade-room" class="hidden bg-slate-900 border border-cyan-900/50 rounded-2xl p-5 shadow-xl flex flex-col gap-5">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 id="trade-partner-title" class="text-sm font-bold text-cyan-400">Negociando com @parceiro</h3>
          <button onclick="cancelTrade()" class="text-xs bg-rose-950 text-rose-400 border border-rose-800 px-3 py-1.5 rounded-lg hover:bg-rose-900 transition-all font-semibold">Cancelar Troca</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- MINHA OFERTA -->
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-user text-emerald-400"></i> Sua Oferta</span>
              <span id="my-trade-status" class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400">Pendente</span>
            </div>
            <div id="my-offered-phones-list" class="flex flex-col gap-2 min-h-[100px] max-h-[160px] overflow-y-auto">
              <!-- Itens adicionados -->
            </div>
            <div class="flex gap-2 mt-2">
              <select id="my-inventory-select" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                <!-- Seus itens disponíveis -->
              </select>
              <button onclick="addItemToTrade()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all">Adicionar</button>
            </div>
            <button id="p1-accept-btn" onclick="toggleAcceptTrade()" class="w-full mt-2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg transition-all">Aceitar Troca</button>
          </div>

          <!-- OFERTA DO PARCEIRO -->
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center">
              <span id="partner-offer-title" class="text-xs font-bold text-slate-300"><i class="fa-solid fa-user text-cyan-400"></i> Oferta do Parceiro</span>
              <span id="partner-trade-status" class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400">Pendente</span>
            </div>
            <div id="partner-offered-phones-list" class="flex flex-col gap-2 min-h-[100px] max-h-[160px] overflow-y-auto">
              <!-- Itens do parceiro -->
            </div>
          </div>
        </div>

        <!-- CHAT DA TROCA -->
        <div class="border-t border-slate-800 pt-4 flex flex-col gap-2">
          <span class="text-xs font-bold text-slate-400">Chat da Negociação</span>
          <div id="trade-chat-messages" class="h-28 bg-slate-950 border border-slate-800 rounded-xl p-3 overflow-y-auto flex flex-col gap-1.5 text-xs">
            <!-- Mensagens -->
          </div>
          <div class="flex gap-2">
            <input type="text" id="trade-chat-input" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') sendTradeMessage()">
            <button onclick="sendTradeMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">Enviar</button>
          </div>
        </div>
      </div>

      <!-- INVENTÁRIO DO USUÁRIO -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
        <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-box-open text-cyan-400"></i> Seu Inventário
        </h3>
        <div id="user-inventory-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <!-- Itens do inventário -->
        </div>
      </div>

    </section>

  </main>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- FIREBASE E SCRIPT DA APLICAÇÃO -->
  <script>
    // Configuração Firebase (Substitua com suas credenciais ou mantenha mock configurado)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTemplate123456",
      authDomain: "tradesystem-demo.firebaseapp.com",
      databaseURL: "https://tradesystem-demo-default-rtdb.firebaseio.com",
      projectId: "tradesystem-demo",
      storageBucket: "tradesystem-demo.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = localStorage.getItem('currentUser') || null;
    let activeTradeId = null;
    let activeTrade = null;
    let userListenerRef = null;
    let tradesListenerRef = null;

    // Itens simulados do sistema
    const itemCatalog = {
      'phone_1': { name: 'Smartphone Alpha', rarity: 'Comum' },
      'phone_2': { name: 'Smartphone Pro Max', rarity: 'Raro' },
      'phone_3': { name: 'Smartphone Ultra X', rarity: 'Épico' },
      'phone_4': { name: 'Smartphone Fold Z', rarity: 'Lendário' }
    };

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      if (currentUser) {
        initSession(currentUser);
      }
    });

    function t(key, params = {}) {
      const translations = {
        tradingWith: 'Negociando com',
        partnerOffer: 'Oferta de {username}',
        accepted: 'Aceito',
        pending: 'Pendente',
        cancelAccept: 'Cancelar Aceite',
        acceptTrade: 'Aceitar Troca',
        tradeSent: 'Convite de troca enviado para @{username}',
        tradeCompleted: 'Troca concluída com sucesso!'
      };
      let text = translations[key] || key;
      Object.keys(params).forEach(p => {
        text = text.replace(`{${p}}`, params[p]);
      });
      return text;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg transition-all flex items-center gap-2 ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-cyan-600'}`;
      toast.innerHTML = `<i class="fa-solid fa-info-circle"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function playSound(type) {
      // Função simulada de som
    }

    async function handleAuth(action) {
      const usernameInput = document.getElementById('auth-username');
      const username = usernameInput.value.trim().toLowerCase();
      if (!username) {
        showToast('Digite um nome de usuário válido', 'error');
        return;
      }

      const userRef = db.ref('/users/' + username);
      const snap = await userRef.once('value');

      if (action === 'register') {
        if (snap.exists()) {
          showToast('Este usuário já existe. Faça login.', 'error');
          return;
        }
        // Cria usuário com inventário inicial padrão
        await userRef.set({
          inventory: { 'phone_1': 2, 'phone_2': 1 }
        });
        showToast('Cadastro realizado com sucesso!', 'success');
      } else {
        if (!snap.exists()) {
          showToast('Usuário não encontrado. Cadastre-se.', 'error');
          return;
        }
        showToast('Login efetuado com sucesso!', 'success');
      }

      localStorage.setItem('currentUser', username);
      initSession(username);
    }

    function logout() {
      localStorage.removeItem('currentUser');
      if (userListenerRef) userListenerRef.off();
      if (tradesListenerRef) tradesListenerRef.off();
      currentUser = null;
      activeTradeId = null;
      activeTrade = null;
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('display-username').innerText = '';
      document.getElementById('auth-username').value = '';
    }

    function initSession(username) {
      currentUser = username;
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('display-username').innerText = `@${username}`;

      setupListeners();
    }

    function setupListeners() {
      // Listener do usuário atual
      userListenerRef = db.ref('/users/' + currentUser);
      userListenerRef.on('value', (snapshot) => {
        const userData = snapshot.val();
        if (userData) {
          renderInventory(userData.inventory || {});
          populateMySelect();
        }
      });

      // Listener global de trades otimizado
      tradesListenerRef = db.ref('/trades');
      tradesListenerRef.on('value', (snapshot) => {
        const trades = snapshot.val() || {};
        checkActiveTrade(trades);
        checkIncomingRequests(trades);
      });
    }

    function renderInventory(inventory) {
      const grid = document.getElementById('user-inventory-grid');
      grid.innerHTML = '';
      const items = Object.entries(inventory);

      if (items.length === 0) {
        grid.innerHTML = `<span class="text-xs text-slate-500 col-span-full">Seu inventário está vazio.</span>`;
        return;
      }

      items.forEach(([phoneId, count]) => {
        const itemInfo = itemCatalog[phoneId] || { name: phoneId, rarity: 'Comum' };
        const card = document.createElement('div');
        card.className = 'bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col justify-between gap-2';
        card.innerHTML = `
          <div>
            <span class="text-xs font-bold text-slate-200 block">${itemInfo.name}</span>
            <span class="text-[10px] text-cyan-400 font-semibold">${itemInfo.rarity}</span>
          </div>
          <div class="flex justify-between items-center text-xs text-slate-400">
            <span>Qtd: ${count}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function populateMySelect() {
      const select = document.getElementById('my-inventory-select');
      select.innerHTML = '';
      
      db.ref('/users/' + currentUser + '/inventory').once('value').then(snap => {
        const inv = snap.val() || {};
        const items = Object.entries(inv);

        if (items.length === 0) {
          select.innerHTML = `<option value="">Sem itens disponíveis</option>`;
          return;
        }

        items.forEach(([phoneId, count]) => {
          if (count > 0) {
            const itemInfo = itemCatalog[phoneId] || { name: phoneId };
            const opt = document.createElement('option');
            opt.value = phoneId;
            opt.innerText = `${itemInfo.name} (Disp: ${count})`;
            select.appendChild(opt);
          }
        });
      });
    }

    async function searchAndRequestTrade() {
      const input = document.getElementById('trade-search-input');
      const targetUser = input.value.trim().toLowerCase();

      if (!targetUser || targetUser === currentUser) {
        showToast('Digite um nome de usuário válido para troca.', 'error');
        return;
      }

      const targetSnap = await db.ref('/users/' + targetUser).once('value');
      if (!targetSnap.exists()) {
        showToast('Usuário não encontrado.', 'error');
        return;
      }

      sendTradeRequest(targetUser);
    }

    async function sendTradeRequest(targetUser) {
      const cleanP1 = currentUser.toLowerCase();
      const cleanP2 = targetUser.toLowerCase();
      const tradeId = `trade_${cleanP1}_${cleanP2}_${Date.now()}`;
      
      const tradeObj = {
        id: tradeId,
        p1: cleanP1,
        p2: cleanP2,
        p1Offer: [],
        p2Offer: [],
        p1Accept: false,
        p2Accept: false,
        status: 'pending',
        timestamp: Date.now()
      };

      await db.ref('/trades/' + tradeId).set(tradeObj);
      showToast(t('tradeSent', { username: cleanP2 }), 'info');
      playSound('notify');
      
      const searchInput = document.getElementById('trade-search-input');
      if (searchInput) searchInput.value = '';
    }

    function checkIncomingRequests(trades) {
      const container = document.getElementById('incoming-requests-container');
      container.innerHTML = '';
      let hasRequests = false;

      Object.entries(trades).forEach(([id, trade]) => {
        if (trade.p2 === currentUser && trade.status === 'pending') {
          hasRequests = true;
          const reqEl = document.createElement('div');
          reqEl.className = 'bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-xs';
          reqEl.innerHTML = `
            <span>Convite de troca recebido de <b>@${trade.p1}</b></span>
            <div class="flex gap-2">
              <button onclick="acceptTradeRequest('${id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-bold">Aceitar</button>
              <button onclick="rejectTradeRequest('${id}')" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg font-bold">Recusar</button>
            </div>
          `;
          container.appendChild(reqEl);
        }
      });

      if (hasRequests) {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    async function acceptTradeRequest(tradeId) {
      await db.ref(`/trades/${tradeId}/status`).set('active');
      showToast('Troca iniciada!', 'success');
    }

    async function rejectTradeRequest(tradeId) {
      await db.ref(`/trades/${tradeId}/status`).set('rejected');
      showToast('Troca recusada.', 'info');
    }

    function checkActiveTrade(trades) {
      const activeEntry = Object.entries(trades).find(([id, t]) => 
        (t.p1 === currentUser || t.p2 === currentUser) && t.status === 'active'
      );

      const room = document.getElementById('active-trade-room');

      if (!activeEntry) {
        room.classList.add('hidden');
        activeTrade = null;
        activeTradeId = null;
        return;
      }

      activeTradeId = activeEntry[0];
      activeTrade = activeEntry[1];
      room.classList.remove('hidden');

      const isP1 = activeTrade.p1 === currentUser;
      const partnerName = isP1 ? activeTrade.p2 : activeTrade.p1;

      document.getElementById('trade-partner-title').innerText = `${t('tradingWith')} @${partnerName}`;
      document.getElementById('partner-offer-title').innerHTML = `<i class="fa-solid fa-user text-cyan-400"></i> ${t('partnerOffer', { username: '@' + partnerName })}`;

      populateMySelect();

      const myOffer = isP1 ? (activeTrade.p1Offer || []) : (activeTrade.p2Offer || []);
      const partnerOffer = isP1 ? (activeTrade.p2Offer || []) : (activeTrade.p1Offer || []);

      renderOfferedList('my-offered-phones-list', myOffer, true);
      renderOfferedList('partner-offered-phones-list', partnerOffer, false);
      renderTradeChatMessages(activeTrade.messages || {});

      const myAccept = isP1 ? activeTrade.p1Accept : activeTrade.p2Accept;
      const partnerAccept = isP1 ? activeTrade.p2Accept : activeTrade.p1Accept;

      const myStatus = document.getElementById('my-trade-status');
      myStatus.innerText = myAccept ? t('accepted') : t('pending');
      myStatus.className = `text-[11px] px-2.5 py-0.5 rounded-full ${myAccept ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`;

      const partnerStatus = document.getElementById('partner-trade-status');
      partnerStatus.innerText = partnerAccept ? t('accepted') : t('pending');
      partnerStatus.className = `text-[11px] px-2.5 py-0.5 rounded-full ${partnerAccept ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`;

      const p1Btn = document.getElementById('p1-accept-btn');
      p1Btn.innerText = myAccept ? t('cancelAccept') : t('acceptTrade');
      p1Btn.className = myAccept
        ? 'w-full mt-2 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-lg transition-all'
        : 'w-full mt-2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg transition-all';

      if (myAccept && partnerAccept) {
        finalizeTradeTransaction();
      }
    }

    function renderOfferedList(containerId, offerArray, isEditable) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (offerArray.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-500">Nenhum item oferecido</span>`;
        return;
      }

      offerArray.forEach((phoneId, index) => {
        const itemInfo = itemCatalog[phoneId] || { name: phoneId };
        const itemEl = document.createElement('div');
        itemEl.className = 'bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex justify-between items-center text-xs';
        itemEl.innerHTML = `
          <span>${itemInfo.name}</span>
          ${isEditable ? `<button onclick="removeItemFromTrade(${index})" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>` : ''}
        `;
        container.appendChild(itemEl);
      });
    }

    async function addItemToTrade() {
      const select = document.getElementById('my-inventory-select');
      const phoneId = select.value;
      if (!phoneId || !activeTradeId || !activeTrade) return;

      const isP1 = activeTrade.p1 === currentUser;
      const currentOfferField = isP1 ? 'p1Offer' : 'p2Offer';
      let currentOffer = [...(activeTrade[currentOfferField] || [])];

      currentOffer.push(phoneId);

      await db.ref(`/trades/${activeTradeId}`).update({
        [currentOfferField]: currentOffer,
        p1Accept: false,
        p2Accept: false
      });
    }

    async function removeItemFromTrade(index) {
      if (!activeTradeId || !activeTrade) return;

      const isP1 = activeTrade.p1 === currentUser;
      const currentOfferField = isP1 ? 'p1Offer' : 'p2Offer';
      let currentOffer = [...(activeTrade[currentOfferField] || [])];

      currentOffer.splice(index, 1);

      await db.ref(`/trades/${activeTradeId}`).update({
        [currentOfferField]: currentOffer,
        p1Accept: false,
        p2Accept: false
      });
    }

    async function toggleAcceptTrade() {
      if (!activeTradeId || !activeTrade) return;

      const isP1 = activeTrade.p1 === currentUser;
      const acceptField = isP1 ? 'p1Accept' : 'p2Accept';
      const currentStatus = isP1 ? activeTrade.p1Accept : activeTrade.p2Accept;

      await db.ref(`/trades/${activeTradeId}/${acceptField}`).set(!currentStatus);
    }

    async function cancelTrade() {
      if (!activeTradeId) return;
      await db.ref(`/trades/${activeTradeId}/status`).set('cancelled');
      showToast('Troca cancelada.', 'info');
    }

    async function sendTradeMessage() {
      const input = document.getElementById('trade-chat-input');
      const msg = input.value.trim();
      if (!msg || !activeTradeId) return;

      const msgId = 'msg_' + Date.now();
      await db.ref(`/trades/${activeTradeId}/messages/${msgId}`).set({
        sender: currentUser,
        text: msg,
        timestamp: Date.now()
      });

      input.value = '';
    }

    function renderTradeChatMessages(messagesObj) {
      const chatContainer = document.getElementById('trade-chat-messages');
      chatContainer.innerHTML = '';
      const messages = Object.values(messagesObj).sort((a, b) => a.timestamp - b.timestamp);

      if (messages.length === 0) {
        chatContainer.innerHTML = `<span class="text-slate-600 italic">Nenhuma mensagem ainda...</span>`;
        return;
      }

      messages.forEach(m => {
        const msgEl = document.createElement('div');
        msgEl.className = `flex flex-col ${m.sender === currentUser ? 'items-end' : 'items-start'}`;
        msgEl.innerHTML = `
          <span class="text-[10px] text-slate-500">@${m.sender}</span>
          <div class="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-slate-200 max-w-[80%]">${m.text}</div>
        `;
        chatContainer.appendChild(msgEl);
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function finalizeTradeTransaction() {
      if (!activeTrade || !activeTradeId) return;

      const tradeSnap = await db.ref('/trades/' + activeTradeId).once('value');
      if (!tradeSnap.exists()) return;
      const latestTrade = tradeSnap.val();

      if (latestTrade.status === 'completed') return;

      const p1 = latestTrade.p1;
      const p2 = latestTrade.p2;

      const p1Snap = await db.ref('/users/' + p1 + '/inventory').once('value');
      const p2Snap = await db.ref('/users/' + p2 + '/inventory').once('value');

      const p1Inv = p1Snap.val() || {};
      const p2Inv = p2Snap.val() || {};

      const p1Offer = latestTrade.p1Offer || [];
      const p2Offer = latestTrade.p2Offer || [];

      p1Offer.forEach(phoneId => {
        if ((p1Inv[phoneId] || 0) > 0) {
          p1Inv[phoneId]--;
          if (p1Inv[phoneId] <= 0) delete p1Inv[phoneId];
        }
        p2Inv[phoneId] = (p2Inv[phoneId] || 0) + 1;
      });

      p2Offer.forEach(phoneId => {
        if ((p2Inv[phoneId] || 0) > 0) {
          p2Inv[phoneId]--;
          if (p2Inv[phoneId] <= 0) delete p2Inv[phoneId];
        }
        p1Inv[phoneId] = (p1Inv[phoneId] || 0) + 1;
      });

      await db.ref().update({
        [`/users/${p1}/inventory`]: p1Inv,
        [`/users/${p2}/inventory`]: p2Inv,
        [`/trades/${activeTradeId}/status`]: 'completed'
      });

      playSound('success');
      showToast(t('tradeCompleted'), 'success');
    }
  </script>
</body>
